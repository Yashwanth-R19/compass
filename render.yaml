# Render Blueprint (https://render.com/docs/blueprint-spec). Deploy with
# "New +" -> "Blueprint" in the Render dashboard, pointed at this repo.
# See DEPLOY.md for the full step-by-step, including exact values.

services:
  - type: web
    name: compass-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health

    # `preDeployCommand` is rejected outright on Render's free plan ("Blueprint
    # ... pre-deploy command is not supported for free tier services"). The
    # original design (migrations in a pre-deploy step, never in the
    # container's own start command) exists to avoid two instances racing
    # `alembic upgrade head` against the same database at boot -- but
    # Render's FREE tier never runs more than one instance of a service at a
    # time (no horizontal scaling on free), so that race can't actually
    # happen here, and folding the migration into `dockerCommand` (which
    # overrides the Dockerfile's CMD for a `runtime: docker` service -- NOT
    # `startCommand`, which is for non-Docker runtimes only) is safe
    # specifically because of that constraint. If you ever upgrade this
    # service to a paid plan that scales beyond one instance, switch back to
    # `preDeployCommand: alembic upgrade head` and drop
    # `alembic upgrade head &&` from the line below -- never run both, and
    # never leave migrations in the container's own command on a
    # multi-instance plan.

    envVars:
      - key: DATABASE_URL
        sync: false # set in the Render dashboard -- the Neon pooled connection string
      - key: ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false # the deployed Vercel URL, e.g. https://compass.vercel.app
      - key: COMPASS_CORS_ORIGINS
        sync: false # comma-separated extra allowed origins, e.g. Vercel preview URLs
      - key: COMPASS_WORKER_MODE
        value: actions
      - key: COMPASS_WORKER_REPO
        sync: false # "{owner}/{repo}" of the public mining-worker repository
      - key: COMPASS_WORKER_PAT
        sync: false # fine-grained PAT, Actions read/write on COMPASS_WORKER_REPO only
      - key: COMPASS_MAX_REPO_MB
        value: "300"
      - key: COMPASS_VERSION
        sync: false # bump per release so /health reports the running build
