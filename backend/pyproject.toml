[project]
name = "compass-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<1.15",
    psycopg[binary]>=3.2,<4.0,
    "pydantic-settings>=2.7,<2.8",
    "python-dotenv>=1.0,<1.1",
    "lizard>=1.17,<1.18",
    "gitpython>=3.1,<3.2",
    "networkx>=3.2,<3.5",
    "tree-sitter>=0.21,<0.24",
    "tree-sitter-python>=0.21,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    "httpx>=0.28,<0.29",
    "ruff>=0.8,<0.9",
    "black>=24.10,<25",
    "mypy>=1.13,<1.14",
    "pytest-cov>=6.0,<6.1",
    "testcontainers[postgresql]>=4.9,<4.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)` default-argument pattern is the
# idiomatic, required way to declare dependencies -- not the mutable-default
# bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.engines.*", "app.baseline.*", "app.languages.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party libs with no stubs/py.typed marker -- not our code to fix.
module = ["lizard", "networkx", "tree_sitter", "tree_sitter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow-running",
]
