[project]
name = "compass-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<1.15",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.7,<2.8",
    "python-dotenv>=1.0,<1.1",
    "lizard>=1.17,<1.18",
    "gitpython>=3.1,<3.2",
    "networkx>=3.2,<3.5",
    "numpy>=2.0,<3.0",
    "scipy>=1.13,<2.0",
    "tree-sitter>=0.21,<0.24",
    "tree-sitter-python>=0.21,<0.24",
    "tree-sitter-javascript>=0.21,<0.24",
    "tree-sitter-typescript>=0.21,<0.24",
    "tree-sitter-java>=0.21,<0.24",
    "cryptography>=43,<44",
    "pyjwt>=2.9,<2.10",
    # Session 12: the narrative layer's provider adapters (app/narrative/providers.py)
    # are plain JSON POSTs over httpx -- no provider SDK, per the session
    # prompt's explicit "two SDKs is two dependency trees for no benefit."
    # Already present as a dev-only dependency (FastAPI's TestClient); moved
    # to a real runtime dependency here since production code now imports it
    # directly too.
    "httpx>=0.28,<0.29",
    # Session 14: parses backend/app/baseline/corpus_repos.yaml (the curated
    # corpus repository list, app/baseline/build_corpus.py) -- the smallest,
    # most standard way to read a hand-reviewable YAML config file; no other
    # module in this codebase needs YAML parsing.
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    # httpx moved to the main dependency list above (session 12) -- kept out
    # of this list now to avoid declaring it twice.
    "ruff>=0.8,<0.9",
    "black>=24.10,<25",
    "mypy>=1.13,<1.14",
    "pytest-cov>=6.0,<6.1",
    "testcontainers[postgresql]>=4.9,<4.10",
    # Session 14: type stubs for pyyaml, needed by the scoped mypy run over
    # app.baseline (which now includes build_corpus.py).
    "types-PyYAML>=6.0,<7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)` default-argument pattern is the
# idiomatic, required way to declare dependencies -- not the mutable-default
# bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.engines.*", "app.baseline.*", "app.languages.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party libs with no stubs/py.typed marker -- not our code to fix.
module = ["lizard", "networkx", "tree_sitter", "tree_sitter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow-running",
]
