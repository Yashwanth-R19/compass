name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/compass_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/compass_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend[dev]
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: ruff
        run: ruff check app tests

      - name: black --check
        run: black --check app tests

      - name: mypy (scoped)
        run: mypy app/engines app/baseline app/languages

      - name: pytest
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: oxlint
        run: npm run lint

      - name: prettier --check
        run: npm run format:check

      - name: build
        run: npm run build
