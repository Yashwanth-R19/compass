name: Reaper

# Public repository -- see mine.yml's header comment. reap_stale_runs()/
# run_eviction() print only their own count log lines, but
# app/jobs/log_redaction.py's filter is still installed the same way
# worker.py installs it (app/jobs/reaper.py::main), as defensive insurance
# against any future log line that might otherwise echo something sensitive.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reap:
    runs-on: ubuntu-latest
    # Reaping stale runs and running eviction's storage check are both cheap,
    # DB-only operations -- comfortably under STALE_AFTER_MINUTES=20
    # (app/jobs/reaper.py) so this job's own timeout is never what makes a
    # run look reaper-stale to itself.
    timeout-minutes: 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install ./backend

      - name: Reap stale runs and run storage eviction
        run: python -m app.jobs.reaper
